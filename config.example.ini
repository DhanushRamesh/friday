# Personal assistant configuration.
#
# Precedence, lowest to highest:
#   built-in defaults  <  this file  <  environment variables
#
# Every key below can be overridden by an environment variable named
# ASSISTANT_<SECTION>_<KEY>, uppercased. For example:
#   [database] password  ->  ASSISTANT_DATABASE_PASSWORD
#   [server] addr        ->  ASSISTANT_SERVER_ADDR
# Keys outside any section use ASSISTANT_<KEY>, so env -> ASSISTANT_ENV.
#
# Copy this file to config.ini and edit. config.ini is git-ignored so real
# credentials never reach the repository.

# dev or production. Production rejects dev-only shortcuts such as a blank
# database password.
env = dev

[server]
# Loopback by default. ":8080" looks like localhost but binds every
# interface, which would expose a plain-HTTP service carrying bearer tokens
# to anyone on the network.
#
# In production the server refuses to start on a public interface. Put TLS in
# front of it instead; see deployments/README.md.
#
# A phone cannot reach loopback on another machine, so testing the Android app
# against a the server running here needs "0.0.0.0:8080" instead. That puts a
# plain-HTTP service carrying bearer tokens on the local network, which is
# fine on a home wifi and is not fine anywhere else.
addr                = 127.0.0.1:8080

# Permits a public interface in production anyway, for when something else
# already terminates TLS. Leave it alone unless that is true.
allow_public_bind   = false
read_header_timeout = 5s
idle_timeout        = 60s
shutdown_timeout    = 15s
request_timeout     = 30s

[log]
# debug, info, warn or error
level  = info
# text for a terminal, json for log aggregation
format = text
# attach source file and line to every record
source = true

[database]
host = 127.0.0.1
port = 3306
user = assistant
name = assistant
# Leave blank on a developer machine using local trust auth.
# Must be set when env = production.
password = friday_dev

# Apply outstanding migrations at startup. Turn off to migrate as a separate
# step instead.
auto_migrate = true

max_open_conns    = 25
max_idle_conns    = 5
conn_max_lifetime = 5m
connect_timeout   = 5s

[assistant]
# What the assistant calls itself when it answers.
#
# Here rather than in the code because it is your choice, not the server's:
# the same binary serves whatever the assistant is called today without being
# rebuilt. Leave it empty and it works exactly the same, never saying what it
# is called.
name = Jarvis

# The manner it answers in: plain, jarvis or friday.
#
# This is the manner it starts in the first time. Choosing one on the settings
# page stores that choice, and the stored one wins from then on.
persona = jarvis

[homeassistant]
# How to reach Home Assistant, so the assistant can say something without
# having been asked -- a conversation it has just named, a timer that has
# finished.
#
# Entirely optional. Leave it out and the assistant answers when spoken to and
# says nothing otherwise, exactly as before.
#
# The token is a long-lived access token: in Home Assistant, your profile ->
# Security -> Long-lived access tokens -> Create token. It can control the
# whole house, so supply it through the environment on any machine where this
# file might be read by someone else:
#
#   FRIDAY_HOMEASSISTANT_TOKEN=...
#
# url       = http://localhost:8123
# token     =
# satellite = assist_satellite.laptop_lva_assist_satellite

[provider]
# Which engine answers a chat: stub or platformai.
#
# The stub answers from a script, needing no credentials and no network. It is
# useful for working on everything that surrounds an answer.
name = stub

[platformai]
# Zoho Platform AI. Read only when it is the selected provider.
#
# These are the public endpoints, reachable from anywhere. The internal ones
# (accounts.csez.zohocorpin.com, platformai.csez.zohocorpin.com) serve the same
# paths but only from the corporate network.
#
# Supply the credentials through the environment on any machine where this file
# might be read by someone else:
#
#   ASSISTANT_PLATFORMAI_CLIENT_SECRET=...
#   ASSISTANT_PLATFORMAI_REFRESH_TOKEN=...
client_id     =
client_secret =
refresh_token =
portal_id     = PrimeumWeb

vendor = anthropic
model  = claude-sonnet-4-6

token_url    = https://accounts.zoho.com/oauth/v2/token
chat_url     = https://platformai.zoho.com/internalapi/v2/ai/chat
scope        = PlatformAI.organizations.all
redirect_uri = https://www.google.com/

timeout = 120s

# Only needed for the internal endpoints, whose certificates come from an
# internal authority. The public ones present ordinary certificates.
insecure_skip_verify = false
