# FRIDAY configuration.
#
# Precedence, lowest to highest:
#   built-in defaults  <  this file  <  environment variables
#
# Every key below can be overridden by an environment variable named
# FRIDAY_<SECTION>_<KEY>, uppercased. For example:
#   [database] password  ->  FRIDAY_DATABASE_PASSWORD
#   [server] addr        ->  FRIDAY_SERVER_ADDR
# Keys outside any section use FRIDAY_<KEY>, so env -> FRIDAY_ENV.
#
# Copy this file to config.ini and edit. config.ini is git-ignored so real
# credentials never reach the repository.

# dev or production. Production rejects dev-only shortcuts such as a blank
# database password.
env = dev

[server]
# Loopback by default. ":8080" looks like localhost but binds every
# interface, which would expose a plain-HTTP service carrying bearer tokens
# to anyone on the network.
#
# In production FRIDAY refuses to start on a public interface. Put TLS in
# front of it instead; see deployments/README.md.
addr                = 127.0.0.1:8080

# Permits a public interface in production anyway, for when something else
# already terminates TLS. Leave it alone unless that is true.
allow_public_bind   = false
read_header_timeout = 5s
idle_timeout        = 60s
shutdown_timeout    = 15s
request_timeout     = 30s

[log]
# debug, info, warn or error
level  = info
# text for a terminal, json for log aggregation
format = text
# attach source file and line to every record
source = true

[database]
host = 127.0.0.1
port = 3306
user = friday
name = friday
# Leave blank on a developer machine using local trust auth.
# Must be set when env = production.
password = friday_dev

# Apply outstanding migrations at startup. Turn off to migrate as a separate
# step instead.
auto_migrate = true

max_open_conns    = 25
max_idle_conns    = 5
conn_max_lifetime = 5m
connect_timeout   = 5s

[provider]
# Which engine answers a task: stub or platformai.
#
# The stub answers from a script, needing no credentials and no network. It is
# useful for working on everything that surrounds an answer.
name = stub

[platformai]
# Zoho Platform AI. Read only when it is the selected provider.
#
# These are the public endpoints, reachable from anywhere. The internal ones
# (accounts.csez.zohocorpin.com, platformai.csez.zohocorpin.com) serve the same
# paths but only from the corporate network.
#
# Supply the credentials through the environment on any machine where this file
# might be read by someone else:
#
#   FRIDAY_PLATFORMAI_CLIENT_SECRET=...
#   FRIDAY_PLATFORMAI_REFRESH_TOKEN=...
client_id     =
client_secret =
refresh_token =
portal_id     = PrimeumWeb

vendor = anthropic
model  = claude-sonnet-4-6

token_url    = https://accounts.zoho.com/oauth/v2/token
chat_url     = https://platformai.zoho.com/internalapi/v2/ai/chat
scope        = PlatformAI.organizations.all
redirect_uri = https://www.google.com/

timeout = 120s

# Only needed for the internal endpoints, whose certificates come from an
# internal authority. The public ones present ordinary certificates.
insecure_skip_verify = false
